name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: rust:1.99-bookworm@sha256:fbc3a359627c6b5d9c8b20aae5c413a87392954f020006d7a9f7d95938964b23
      options: --memory=12g --memory-swap=12g
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      PROPTEST_CASES: 512
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install checks
        run: rustup component add rustfmt clippy
      - name: Install GPUI Linux dependencies
        # GPUI Kit's pinned script/install-linux.sh, using Debian package names.
        # https://github.com/longbridge/gpui-kit/blob/4c7f1350331562436df868c55ac33bebc4c6406c/script/install-linux.sh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc g++ clang pkg-config zstd \
            libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev \
            vulkan-validationlayers libvulkan1
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check all schemas and generated mod types
        run: scripts/check-schemas.sh
