name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rust:1.99-bookworm@sha256:fbc3a359627c6b5d9c8b20aae5c413a87392954f020006d7a9f7d95938964b23
      options: --memory=12g --memory-swap=12g
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_TARGET_DIR: /tmp/nd-target
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      PROPTEST_CASES: 512
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install checks
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check all schemas and generated mod types
        run: scripts/check-schemas.sh
